<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>Battle of Towers</title>
    <style>
        /* هەموو CSSـەکەت لێرەدا */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b1a2f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            border: 3px solid #f1c40f;
            border-radius: 12px;
            background: #2d5a1b;
            max-width: 100%;
            max-height: 100vh;
            touch-action: none;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 18px;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
        }
        #shopBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            background: #f1c40f;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="info">⚔️ Battle of Towers</div>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <button id="shopBtn">🛒 Shop</button>

    <script src="script.js"></script>
</body>
</html>
